name: Build Linux Executable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload binary to'
        required: true
        default: 'v1.5.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'linux/requirements.txt'

      - name: Install Linux audio system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev pulseaudio-utils libpulse-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r linux/requirements.txt
          pip install pyinstaller

      - name: Build standalone Linux executable
        run: |
          cd linux
          pyinstaller --noconfirm --onefile --windowed --name "DiscordDesktopAudioMic-linux" main.py
          chmod +x dist/DiscordDesktopAudioMic-linux
          ls -lh dist/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" linux/dist/DiscordDesktopAudioMic-linux --clobber
